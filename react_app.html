    function NeedsWantsGame() {
      const allItems = [
        { name: 'Semester Tuition Fee', type: 'Needs', icon: '🎓', reason: 'Direct academic requirement for your career.' },
        { name: 'Weekly Starbucks Latte', type: 'Wants', icon: '☕', reason: 'High margin discretionary beverage.' },
        { name: 'Hostel Electricity & Water', type: 'Needs', icon: '⚡', reason: 'Essential biological and residential necessity.' },
        { name: 'Premium PS5 Video Game', type: 'Wants', icon: '🎮', reason: 'Entertainment and leisure expenditure.' },
        { name: 'Basic Prescription Medication', type: 'Needs', icon: '💊', reason: 'Critical health and physiological safety.' },
        { name: 'Designer Sneaker Collection', type: 'Wants', icon: '👟', reason: 'Fashion status purchase over utility footwear.' },
        { name: 'Study Wi-Fi High-Speed Internet', type: 'Needs', icon: '📡', reason: 'Core requirement for assignments & research.' },
        { name: 'Fine Dining Weekend Buffet', type: 'Wants', icon: '🍕', reason: 'Social luxury over nutritious meal prep.' }
      ];

      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [gameFinished, setGameFinished] = useState(false);

      const currentItem = allItems[currentIndex];

      const handleChoice = (choice) => {
        if (feedback) return;
        const isCorrect = choice === currentItem.type;
        if (isCorrect) {
          setScore(s => s + 10);
          setFeedback({ correct: true, text: `Correct! ${currentItem.reason}` });
        } else {
          setFeedback({ correct: false, text: `Incorrect! It is a ${currentItem.type}. ${currentItem.reason}` });
        }

        setTimeout(() => {
          setFeedback(null);
          if (currentIndex + 1 < allItems.length) {
            setCurrentIndex(i => i + 1);
          } else {
            setGameFinished(true);
          }
        }, 1500);
      };

      const handleRestart = () => {
        setCurrentIndex(0);
        setScore(0);
        setFeedback(null);
        setGameFinished(false);
      };

      return (
        <section id="game" style={{ padding: '4.5rem 0', backgroundColor: '#FFFFFF', borderTop: '1px solid #E2E8F0', borderBottom: '1px solid #E2E8F0' }}>
          <div className="fintech-container">
            
            <div style={{ textAlign: 'center', maxWidth: '680px', margin: '0 auto 2.5rem auto' }}>
              <div className="badge-pill badge-navy" style={{ marginBottom: '0.75rem' }}>Gamified Knowledge Check</div>
              <h2 style={{ fontSize: '2.25rem', color: '#0F172A', marginBottom: '1rem' }}>
                Needs vs. Wants Decision Sprint
              </h2>
              <p style={{ fontSize: '1.05rem', color: '#475569' }}>
                Can you distinguish non-negotiable living survival needs from discretionary lifestyle wants under pressure?
              </p>
            </div>

            <div className="fintech-card" style={{ maxWidth: '600px', margin: '0 auto', padding: '2.5rem', textAlign: 'center' }}>
              
              {!gameFinished ? (
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.75rem', paddingBottom: '0.75rem', borderBottom: '1px solid #F1F5F9' }}>
                    <span style={{ fontSize: '0.85rem', fontWeight: '700', color: '#64748B' }}>
                      Question {currentIndex + 1} of {allItems.length}
                    </span>
                    <span style={{ fontSize: '0.95rem', fontWeight: '800', color: '#10B981', backgroundColor: '#ECFDF5', padding: '0.2rem 0.6rem', borderRadius: '6px' }}>

                    <div style={{ fontSize: '1.4rem', fontWeight: '800', color: '#0F172A' }}>{currentItem.name}</div>

                    <div style={{ 
                      padding: '0.75rem', 
                      borderRadius: '8px', 
                      marginBottom: '1.5rem', 
                      fontSize: '0.9rem',

                      color: feedback.correct ? '#065F46' : '#991B1B',

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>

                        backgroundColor: '#F5F3FF',
                        color: '#6D28D9',
                        border: '2px solid #DDD6FE',
                        borderRadius: '10px',
                        padding: '1rem',
                        fontWeight: '800',
                        fontSize: '1rem',
                        cursor: feedback ? 'not-allowed' : 'pointer'
                      }}

                      ☕ DISCRETIONARY WANT (30%)
                    </button>

                </div>
              ) : (
                <div style={{ padding: '1rem 0' }}>
                  <div style={{ fontSize: '3.5rem', marginBottom: '1rem' }}>🏆</div>

                    You scored <strong>{score}</strong> out of {allItems.length * 10} points.
                  </p>

                    {score >= 70 ? '🌟 Outstanding financial acumen! You are ready to manage a complex personal budget.' : '👍 Good effort! Review the Budgeting 101 guide to sharpen your discipline.'}
                  </div>
                  <button onClick={handleRestart} className="btn-emerald" style={{ padding: '0.75rem 2rem' }}>
                    Play Again 🔄

    // 7. CHATBOT COMPONENT
    function ChatbotWidget({ onOpenCertificate }) {
      const [isOpen, setIsOpen] = useState(false);
      const [messages, setMessages] = useState([
        { sender: 'bot', text: 'Salam! I am BeeBot, your BudgetBasics AI advisor. How can I assist with your finances today?', time: 'Just now' }
      ]);
      const [inputText, setInputText] = useState('');
      const chatEndRef = useRef(null);

      const presetQuestions = [
        { label: 'How does 50/30/20 work?', reply: 'The 50/30/20 rule splits your monthly take-home salary into 50% Needs (food, rent, tuition), 30% Wants (dining, hobbies), and 20% Savings (emergency fund, investments).' },
        { label: 'How big should my emergency fund be?', reply: 'For students and early pros, aim for 3 to 6 months of basic living expenses (Needs). Keep this in an accessible high-yield or savings account.' },
        { label: 'How can I save with a low stipend?', reply: '1) Automate a minimum 10% transfer on day 1. 2) Cook meals in batch. 3) Split Wi-Fi and subscriptions with hostel mates.' },
        { label: 'How do I claim my certificate?', reply: 'Click the "Get Certificate" button in the top navigation, enter your full name, and hit Print / Save as PDF!' }
      ];

      useEffect(() => {
        if (isOpen) {
          chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
      }, [messages, isOpen]);

      const handleSend = (textToSend) => {
        const text = textToSend || inputText;
        if (!text.trim()) return;

        const userMsg = { sender: 'user', text: text.trim(), time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
        setMessages(prev => [...prev, userMsg]);
        if (!textToSend) setInputText('');

        setTimeout(() => {
          let botReply = "That's a great question! Keep your fixed costs below 50% and automate savings as soon as your salary or allowance arrives.";
          const lower = text.toLowerCase();
          const foundPreset = presetQuestions.find(p => p.label.toLowerCase() === lower);
          
          if (foundPreset) {
            botReply = foundPreset.reply;
          } else if (lower.includes('cert') || lower.includes('degree')) {
            botReply = 'You can generate and print your Aptech-verified BudgetBasics certificate from the top right button!';
          }

          setMessages(prev => [...prev, {
            sender: 'bot',
            text: botReply,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          }]);
        }, 400);
      };

      return (
        <div style={{ position: 'fixed', bottom: '24px', right: '24px', zIndex: 999 }}>
          {isOpen && (
            <div style={{ 
              width: '360px', 
              height: '490px', 
              backgroundColor: '#FFFFFF', 
              borderRadius: '16px', 
              boxShadow: '0 20px 25px -5px rgba(15, 23, 42, 0.25)',
              border: '1px solid #E2E8F0',
              display: 'flex',
              flexDirection: 'column',
              overflow: 'hidden',
              marginBottom: '1rem'
            }}>
              <div style={{ backgroundColor: '#0F172A', padding: '1rem 1.25rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', color: '#FFFFFF' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.65rem' }}>
                  <div style={{ width: '32px', height: '32px', borderRadius: '50%', backgroundColor: '#10B981', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: '800', color: '#0F172A' }}>
                    🐝
                  </div>
                  <div>
                    <div style={{ fontWeight: '700', fontSize: '0.95rem' }}>BeeBot Assistant</div>
                    <div style={{ fontSize: '0.7rem', color: '#94A3B8' }}>Active Financial AI</div>
                  </div>
                </div>
                <button onClick={() => setIsOpen(false)} style={{ background: 'none', border: 'none', color: '#94A3B8', cursor: 'pointer', fontSize: '1.25rem' }}>×</button>
              </div>

              <div style={{ flex: 1, padding: '1rem', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '0.85rem', backgroundColor: '#F8FAFC' }}>
                {messages.map((m, idx) => (
                  <div key={idx} style={{ alignSelf: m.sender === 'user' ? 'flex-end' : 'flex-start', maxWidth: '82%' }}>
                    <div style={{ 
                      padding: '0.7rem 0.9rem', 
                      borderRadius: m.sender === 'user' ? '12px 12px 2px 12px' : '12px 12px 12px 2px',
                      backgroundColor: m.sender === 'user' ? '#0F172A' : '#FFFFFF',
                      color: m.sender === 'user' ? '#FFFFFF' : '#1E293B',
                      fontSize: '0.85rem',
                      border: m.sender === 'bot' ? '1px solid #E2E8F0' : 'none'
                    }}>
                      {m.text}
                    </div>
                  </div>
                ))}
                <div ref={chatEndRef} />
              </div>

              <div style={{ padding: '0.5rem 0.75rem', backgroundColor: '#FFFFFF', borderTop: '1px solid #F1F5F9', display: 'flex', gap: '0.4rem', overflowX: 'auto' }}>
                {presetQuestions.map((pq, i) => (
                  <button 
                    key={i}
                    onClick={() => handleSend(pq.label)}
                    style={{ fontSize: '0.72rem', padding: '0.3rem 0.6rem', borderRadius: '9999px', backgroundColor: '#F1F5F9', border: '1px solid #E2E8F0', color: '#334155', cursor: 'pointer', flexShrink: 0 }}
                  >
                    {pq.label}
                  </button>
                ))}
              </div>

              <form onSubmit={(e) => { e.preventDefault(); handleSend(); }} style={{ padding: '0.75rem', backgroundColor: '#FFFFFF', borderTop: '1px solid #E2E8F0', display: 'flex', gap: '0.5rem' }}>
                <input 
                  type="text" 
                  placeholder="Ask BeeBot..." 
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  style={{ flex: 1, padding: '0.5rem 0.75rem', borderRadius: '8px', border: '1.5px solid #E2E8F0', fontSize: '0.85rem', outline: 'none' }}
                />
                <button type="submit" className="btn-emerald" style={{ padding: '0.5rem 0.85rem', fontSize: '0.85rem' }}>Send</button>
              </form>
            </div>
          )}

          <button 
            onClick={() => setIsOpen(!isOpen)}
            style={{
              width: '56px',
              height: '56px',
              borderRadius: '50%',
              backgroundColor: '#0F172A',
              color: '#10B981',
              border: '2px solid #10B981',
              boxShadow: '0 8px 16px rgba(15, 23, 42, 0.3)',
              cursor: 'pointer',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              fontSize: '1.5rem'
            }}
          >
            {isOpen ? '✕' : '💬'}
          </button>
        </div>
      );
    }

            <div style={{ marginBottom: '1.5rem' }}>

              <input 
                type="text"

            </div>

            <div style={{ border: '8px double #CBD5E1', borderRadius: '12px', padding: '2.5rem 2rem', backgroundColor: '#FFFFFF', textAlign: 'center', position: 'relative', marginBottom: '1.5rem' }}>
              <div style={{ position: 'absolute', top: '20px', right: '20px', backgroundColor: '#ECFDF5', border: '1.5px solid #10B981', color: '#065F46', padding: '0.35rem 0.75rem', borderRadius: '8px', fontSize: '0.7rem', fontWeight: '800' }}>
                ✓ VERIFIED CREDENTIAL
              </div>

              <div style={{ fontSize: '0.8rem', fontWeight: '800', letterSpacing: '0.15em', color: '#10B981', textTransform: 'uppercase', marginBottom: '0.5rem' }}>
                APTECH COMPUTER EDUCATION &bull; ACADEMIC EXCELLENCE
              </div>

              <h2 style={{ fontSize: '2rem', color: '#0F172A', fontWeight: '800', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '0.5rem' }}>
                Certificate of Achievement
              </h2>

              <div style={{ fontSize: '0.88rem', color: '#64748B', fontStyle: 'italic', marginBottom: '1.25rem' }}>
                This official credential certifies that
              </div>

              <div style={{ fontSize: '2.2rem', fontWeight: '800', color: '#0F172A', borderBottom: '2px solid #10B981', display: 'inline-block', padding: '0 2rem 0.35rem 2rem', marginBottom: '1.25rem' }}>
                {recipientName || 'Your Name Here'}
              </div>

              <div style={{ fontSize: '0.9rem', color: '#334155', maxWidth: '520px', margin: '0 auto 1.75rem auto', lineHeight: '1.6' }}>
                has successfully mastered foundational budgeting principles, the 50/30/20 allocation framework, expense discipline, and student wealth resilience on the <strong>BudgetBasics Platform</strong>.
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '1rem', alignItems: 'end', paddingTop: '1rem', borderTop: '1px solid #E2E8F0' }}>
                <div>
                  <div style={{ fontSize: '0.8rem', fontWeight: '700', color: '#0F172A' }}>{currentDate}</div>
                  <div style={{ fontSize: '0.68rem', color: '#94A3B8' }}>ISSUE DATE</div>
                </div>
                <div>
                  <div style={{ fontSize: '1.25rem' }}>🏅</div>
                  <div style={{ fontSize: '0.68rem', color: '#059669', fontWeight: '700' }}>BB-CERT-2026-AP</div>
                </div>
                <div>
                  <div style={{ fontSize: '0.8rem', fontWeight: '700', color: '#0F172A' }}>Aptech Evaluation Board</div>
                  <div style={{ fontSize: '0.68rem', color: '#94A3B8' }}>AUTHORIZED SIGNATURE</div>
                </div>
              </div>
            </div>

            <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '1rem' }}>
              <button onClick={onClose} className="btn-secondary">Close</button>
              <button onClick={() => window.print()} className="btn-emerald">🖨️ Print / Save PDF</button>
            </div>
          </div>
        </div>
      );
    }

    // 9. SITEMAP MODAL

      const branches = [

          pillar: 'Branch 1: Foundation & Basics',

                    <span style={{ fontSize: '0.85rem', fontWeight: '800', color: '#0F172A' }}>{b.pillar}</span>

                  <div style={{ display: 'flex', flexDirection: 'column', gap: '0.45rem' }}>
                    {b.nodes.map((n, i) => (
                      <a key={i} href={n.link} onClick={onClose} style={{ fontSize: '0.78rem', color: '#475569', textDecoration: 'none', padding: '0.35rem 0.5rem', borderRadius: '6px', backgroundColor: '#FFFFFF', border: '1px solid #E2E8F0' }}>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '2.5rem', marginBottom: '3rem' }}>

                  <div style={{ width: '34px', height: '34px', borderRadius: '8px', backgroundColor: '#10B981', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#0F172A', fontWeight: '800', fontSize: '1.2rem' }}>$</div>
